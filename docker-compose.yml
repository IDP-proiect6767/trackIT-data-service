version: "3.9"

# Local development only — production stack lives in trackIT-infrastructure

services:
  data-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATA_DB_NAME:-data_db}
      POSTGRES_USER: ${DATA_DB_USER:-data_user}
      POSTGRES_PASSWORD: ${DATA_DB_PASSWORD}
    volumes:
      - data_db_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATA_DB_USER:-data_user} -d ${DATA_DB_NAME:-data_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5433:5432"

  data-service:
    build: .
    image: florinionita/trackit-data-service:local
    depends_on:
      data-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATA_DB_URL: ${DATA_DB_URL}
      DATA_DB_USER: ${DATA_DB_USER:-data_user}
      DATA_DB_PASSWORD: ${DATA_DB_PASSWORD}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@trackit.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - data-db
    profiles:
      - debug

volumes:
  data_db_volume:
